# openocd.cfg — ESP32-S3 built-in USB Serial/JTAG (303a:1001)

# Optional: single-core debug (CPU0 only)
set ESP32_ONLYCPU 1
set ESP_RTOS none

# Use the board config Espressif documents for built-in USB JTAG
source [find board/esp32s3-builtin.cfg]

# Override speed if you want (board script may set defaults)
adapter speed 20000

# Extra verbosity
debug_level 2

